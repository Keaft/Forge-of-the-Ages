# Configuration file

"early icon" {
    # Path to the PNG icon for the splash screen. [default: icon.png]
    S:"Early Icon Filename"=icon.png
}


general {
    # Automatically maximize the window on startup and when exiting borderless mode. [default: true]
    B:"Always Maximized"=true

    # If disabled, the mod will not override the game's fullscreen behavior. [default: true]
    B:"Enable Borderless"=true

    # Custom title for the game window. [default: Minecraft 1.12.2]
    S:"Window Title"=Forge of the Ages
}


"high-quality icon" {
    # Switch to a high-quality icon after the game loads. (only Windows OS) [default: true]
    B:"Enable High-Quality Icon"=true

    # Path to the ICO icon for high-quality mode. (Note: May work incorrectly if Borderless is disabled due to engine limitations) [default: icon.ico]
    S:"High-Quality Icon Filename"=icon.ico
}


